name: WAT SEO Preflight — no Claude SEO run

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GSC_SITE_URL: ${{ vars.WAT_GSC_SITE_URL || 'sc-domain:watagencybelgium.be' }}
      WAT_GOOGLE_ADS_CUSTOMER_ID: ${{ vars.WAT_GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.WAT_GOOGLE_ADS_LOGIN_CUSTOMER_ID || secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_API_VERSION: v26
      WAT_GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.WAT_GOOGLE_ADS_DEVELOPER_TOKEN || secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WAT_TELEGRAM_BOT_TOKEN: ${{ secrets.WAT_TELEGRAM_BOT_TOKEN }}
      WAT_TELEGRAM_CHAT_ID: ${{ secrets.WAT_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          project_id: steadfast-sign-506214-r8
          workload_identity_provider: projects/119496279676/locations/global/workloadIdentityPools/wat-github/providers/wat-actions
          service_account: wat-seo-automation@steadfast-sign-506214-r8.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python sources, SEO tests and config
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth
          python -m compileall -q scripts
          python -m unittest discover -s tests
          python -m json.tool seo/keyword_targets.json >/dev/null
          python -m json.tool seo/business_profile.json >/dev/null
          python -m json.tool seo/growth_strategy.json >/dev/null
      - name: Verify live Claude, Search Console and Google Ads access (no SEO analysis)
        id: connections
        continue-on-error: true
        run: python scripts/wat_verify_connections.py
      - name: Inspect Actions PR setting (informational only)
        id: pr_permission
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from urllib.error import HTTPError, URLError
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/actions/permissions/workflow",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  flag = json.load(response).get("can_approve_pull_request_reviews")
              status = "ENABLED" if flag is True else "DISABLED" if flag is False else "UNKNOWN"
          except HTTPError as exc:
              status = "UNVERIFIED_HTTP_" + str(exc.code)
          except URLError:
              status = "UNVERIFIED_NETWORK"
          with open(os.environ["GITHUB_OUTPUT"], "a") as result:
              result.write("status=" + status + "\n")
          if status != "ENABLED":
              print("::warning title=GitHub PR setting::" + status + " — cannot infer PR permission from GitHub admin-read HTTP 403. Check repository Settings > Actions > General.")
          else:
              print("GitHub Actions-created PRs enabled")
          PY
      - name: Check direct WAT Telegram separately
        id: telegram
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get("WAT_TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("WAT_TELEGRAM_CHAT_ID", "").strip()
          status = "NOT_CONFIGURED_EXTERNAL_BRIDGE"
          if token and chat:
              try:
                  payload = urllib.parse.urlencode({
                      "chat_id": chat, "text": "WAT SEO preflight: Telegram delivery test. No site changes."
                  }).encode()
                  req = urllib.request.Request("https://api.telegram.org/bot" + token + "/sendMessage", data=payload)
                  with urllib.request.urlopen(req, timeout=20) as response:
                      status = "SENT" if json.load(response).get("ok") else "FAILED"
              except Exception as exc:
                  status = "FAILED_" + type(exc).__name__
          with open(os.environ["GITHUB_OUTPUT"], "a") as result:
              result.write("status=" + status + "\n")
          if status != "SENT":
              print("::warning title=WAT Telegram::" + status + " — test ISOPROTECH WAT Telegram bridge separately.")
          else:
              print("WAT Telegram direct send verified")
          PY
      - name: Collect complete WAT weekly Google keyword and URL Inspection evidence
        id: evidence
        continue-on-error: true
        if: steps.connections.outcome == 'success'
        run: |
          python scripts/wat_seo_weekly_collect.py
          python scripts/wat_seo_opportunities.py
          python - <<'PY'
          import json, os
          data=json.load(open("seo-weekly-context.json",encoding="utf-8"))
          ads=data.get("keyword_planner") or {}
          indexing=data.get("gsc_indexing") or {}
          discovered=data.get("gsc_url_inventory") or {}
          problems=[x for x in indexing.get("results",[]) if x.get("issue") and x.get("status")=="OK"]
          print("GOOGLE ADS:",ads.get("status"),"clusters:",ads.get("successful_clusters"),"/",ads.get("attempted_clusters"))
          print("GSC URL INSPECTION:",indexing.get("status"),"inspected:",indexing.get("inspected_count"),"discovered:",discovered.get("discovered_count"))
          print("GOOGLE INDEXING ISSUES:",len(problems))
          for x in problems[:15]:
              print("INDEXING:",x.get("url"),"|",x.get("coverage_state"),"|",x.get("verdict"),"| canonical:",x.get("google_canonical"))
          lines=["## WAT full SEO evidence","",
                 "| Source | Result |","|---|---|",
                 f"| Keyword Planner | {ads.get('status')} ({ads.get('successful_clusters',0)}/{ads.get('attempted_clusters',0)} clusters) |",
                 f"| GSC URL Inspection | {indexing.get('status')} ({indexing.get('inspected_count',0)} URLs) |",
                 f"| Canonical/indexing findings | {len(problems)} need review |",
                 f"| GSC excluded-page CSV supplied | {discovered.get('gsc_export_present',False)} |",
                 "", "### Highest demand candidates (estimated monthly searches)"]
          for name,group in (ads.get("clusters") or {}).items():
              rows=[x for x in group.get("ideas",[]) if isinstance(x.get("avg_monthly_searches"),int) and x["avg_monthly_searches"]>0][:3]
              info=", ".join(x["keyword"]+" ("+str(x["avg_monthly_searches"])+"/mo)" for x in rows)
              print("KEYWORD:",name,info or group.get("status"))
              lines.append("- "+name+": "+(info or group.get("status","no ideas")))
          lines.extend(["","This does not enumerate all excluded URLs from GSC Page indexing UI.",
                        "No Claude SEO analysis or live site changes were executed."])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(lines)+"\n")
          if ads.get("status") not in ("OK","PARTIAL") or indexing.get("status")!="OK":
              raise SystemExit("Google evidence incomplete; investigate API status.")
          PY
      - name: Upload WAT full Google research data (no Claude)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wat-google-evidence-preflight
          path: |
            seo-weekly-context.json
            seo-weekly-opportunities.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preflight verdict
        if: always()
        env:
          CONNECTIONS: ${{ steps.connections.outcome }}
          PR_PERMISSION: ${{ steps.pr_permission.outputs.status }}
          TELEGRAM: ${{ steps.telegram.outputs.status }}
          EVIDENCE: ${{ steps.evidence.outcome }}
        shell: bash
        run: |
          {
            echo '## WAT SEO preflight'
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| Claude, GSC, URL Inspection, Keyword Planner | $CONNECTIONS |"
            echo "| GitHub Actions PR setting | $PR_PERMISSION |"
            echo "| Direct WAT Telegram | $TELEGRAM |"
            echo "| Full seven-cluster keyword + page inventory audit | $EVIDENCE |"
            echo
            echo 'A green result proves core Google/Claude API connectivity only. Telegram bridge and GitHub PR settings require separate verification.'
            echo 'No full Claude SEO run and no website deployment took place.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CONNECTIONS" != "success" ] || [ "$EVIDENCE" != "success" ]; then
            echo "::error::Core Google/Claude connection test failed."
            exit 1
          fi
          echo "::notice::Core connections passed; inspect delivery warnings separately."
