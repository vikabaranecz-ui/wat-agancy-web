name: WAT Agency — Dedicated Weekly SEO Claude

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Europe/Brussels"

concurrency:
  group: wat-weekly-seo-claude
  cancel-in-progress: false

# Default for every job: read-only. Only the deterministic publish job below gets write scopes.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: evidence + Claude analysis. READ-ONLY GitHub token.
  # Claude can edit files in this throwaway checkout, but the token cannot push,
  # merge, open PRs or create issues. Protection is enforced by GitHub, not the prompt.
  # ---------------------------------------------------------------------------
  analyse:
    # Monday reporting remains active. Missing credentials produce a BLOCKED issue,
    # not invented evidence or an automatically published site change.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      skip: ${{ steps.duplicate.outputs.skip }}
      ready: ${{ steps.gate.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      GSC_SITE_URL: ${{ vars.WAT_GSC_SITE_URL || 'sc-domain:watagencybelgium.be' }}
      WAT_SITE_URL: https://www.watagencybelgium.be
      WAT_GOOGLE_ADS_CUSTOMER_ID: ${{ vars.WAT_GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.WAT_GOOGLE_ADS_LOGIN_CUSTOMER_ID || secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_API_VERSION: v26
      WAT_GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.WAT_GOOGLE_ADS_DEVELOPER_TOKEN || secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
    steps:
      - name: Avoid duplicate scheduled paid analysis
        id: duplicate
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY="$(TZ=Europe/Brussels date +%F)"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --json title --jq 'length' --limit 20)"
          if [ "$EXISTING" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout WAT repository
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: steps.duplicate.outputs.skip != 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: steadfast-sign-506214-r8
          workload_identity_provider: projects/119496279676/locations/global/workloadIdentityPools/wat-github/providers/wat-actions
          service_account: wat-seo-automation@steadfast-sign-506214-r8.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Python
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install public-site and GSC collector dependencies
        if: steps.duplicate.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 google-auth

      - name: Validate WAT SEO collectors and configuration
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          python -m compileall -q scripts/wat_brand.py scripts/wat_ads_collect.py scripts/wat_seo_weekly_collect.py scripts/wat_seo_opportunities.py scripts/wat_claude_skill_inventory.py scripts/wat_verify_connections.py
          python -m unittest discover -s tests
          python -m json.tool seo/keyword_targets.json > /dev/null
          python -m json.tool seo/business_profile.json > /dev/null
          python -m json.tool seo/growth_strategy.json > /dev/null

      - name: Collect WAT-only weekly SEO evidence
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/wat_seo_weekly_collect.py

      - name: Discover actual Claude skills in runner
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/wat_claude_skill_inventory.py

      - name: Build measured WAT keyword opportunity register
        if: steps.duplicate.outputs.skip != 'true'
        run: python scripts/wat_seo_opportunities.py

      - name: Gate on real GSC data and a working (not merely present) Claude key
        if: steps.duplicate.outputs.skip != 'true'
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from wat_verify_connections import test_claude
          data = json.load(open("seo-weekly-context.json"))
          claude = test_claude()
          ready = data["gsc"]["status"] == "OK" and claude["status"] == "CONNECTED"
          print("GSC:", data["gsc"]["status"], "| Ads:", data["keyword_planner"]["status"],
                "| Claude:", claude["status"], "-", claude["detail"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("ready=" + str(ready).lower() + "\n")
          if not ready:
              print("GSC or Claude not verified; a BLOCKED issue will be created, no metrics invented.")
          PY

      - name: Run WAT-only weekly SEO and missing-gap analysis (read-only token)
        if: steps.duplicate.outputs.skip != 'true' && steps.gate.outputs.ready == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: |
            This is the scheduled WAT Agency Belgium SEO run. Work ONLY in this WAT repository. The goal is deep business problem-to-solution SEO for Dutch-speaking Belgian service companies: weak quotation-to-sale rate, unpredictable project pipeline, poor lead quality, price-only competition, wasted advertising spend, low trust, missed enquiries, dependence on referrals. Distinguish actual business pain from generic marketing symptoms, and prioritize what WAT can genuinely solve. Current GSC may have near-zero rows; perform evidence-led technical monitoring and Keyword Planner discovery without fabricating ranking baselines.
            Read `.claude/agents/weekly-seo.md` in full, then read:
            `seo/business_profile.json`, `seo/keyword_targets.json`,
            `seo/growth_strategy.json`, `seo-weekly-context.json`,
            `seo-weekly-opportunities.json`, `seo-weekly-skills.json`.
            Determine today's date in Europe/Brussels. Flag existing English-only homepage versus Dutch-speaking target and propose a crawlable /nl/ architecture for approval only; do not publish a translation without owner review.
            REQUIRE real WAT GSC query-to-page 28d and previous 28d evidence. Use WAT Keyword Planner Belgium Dutch-language datasets when available. If Ads is unavailable, continue strictly with authenticated GSC plus public health audit; mark missing volumes, do not invent them.
            First audit GSC URL Inspection API status for every sampled canonical URL from seo-weekly-context.json > gsc_indexing: explain Google verdict, coverageState, indexingState, pageFetchState, googleCanonical vs userCanonical, lastCrawlTime. Distinguish never crawled, excluded, intentional redirects, and current live accessibility. Prioritize actual indexing errors ahead of speculative new content. Sampling is not the complete Page Indexing report.
            Then audit technical, commercial keywords, intent-to-page mapping, missing
            sector/problem/question coverage, source-supported competitor gaps,
            CTA/conversion and AI answerability. Use evidence rather than guesses.
            Require a concrete evidence ledger for each proposed change: source, observed gap, affected URL/query, local search demand where available, diagnosis, smallest reasonable fix, regression risk, acceptance checks, measured follow-up.
            Do NOT edit a page to satisfy keyword quota; choose real problems and verify site health before proposing edits.
            Inspect the ACTUAL readable SKILL.md manifests listed in seo-weekly-skills.json; if empty, state NO SKILLS AVAILABLE and continue.
            Never treat a seed keyword as a validated target.
            Check existing WAT PRs (read-only `gh pr list` / `gh pr view`) and avoid conflicts with pending consent/contact work.

            HOW TO DELIVER (enforced by the workflow, your GitHub token is read-only):
            - Make any proposed site edits directly in the working tree. Do NOT run git commit, git push or gh write commands.
            - Do not modify `.github/`, `.claude/`, `scripts/`, `tests/` or `seo-weekly-*.json`; such edits are discarded.
            - Write the full weekly report (evidence, gaps, skill evidence, proposed changes, Ukrainian owner summary) to `seo-weekly-report.md`.
            - Write exactly one word to `seo-weekly-mode.txt`: BLOCKED, MONITOR, AUDIT, PROPOSED or NEEDS APPROVAL.
            A separate workflow job opens a DRAFT pull request and the weekly issue for human review. Nothing is merged or published automatically.
            If information is insufficient, report explicitly rather than fabricating rankings.
          claude_args: |
            --effort high
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(python:*),Bash(python3:*),Bash(ls:*),Bash(cat:*),Skill"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git remote:*),Bash(gh pr merge:*),Bash(gh pr create:*),Bash(gh pr review:*),Bash(gh issue create:*),Bash(gh api:*),Bash(gh workflow:*),Bash(gh release:*),Bash(npm:*),Bash(npx:*),Bash(curl:*),Bash(wget:*)"

      - name: Package proposal (site files only) and report
        if: always() && steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p proposal
          # Only website content may be proposed; workflow, agent, scripts and tests are excluded.
          git diff --binary -- . ':(exclude).github' ':(exclude).claude' ':(exclude)scripts' ':(exclude)tests' \
            ':(exclude)seo-weekly-*.json' ':(exclude)seo-weekly-report.md' ':(exclude)seo-weekly-mode.txt' > proposal/site.patch || true
          git ls-files --others --exclude-standard -- . ':(exclude).github' ':(exclude).claude' ':(exclude)scripts' \
            ':(exclude)tests' ':(exclude)seo-weekly-*' ':(exclude)proposal' > proposal/new-files.txt || true
          tar -czf proposal/new-files.tgz -T proposal/new-files.txt 2>/dev/null || true
          cp seo-weekly-report.md proposal/ 2>/dev/null || echo "No Claude report produced." > proposal/seo-weekly-report.md
          cp seo-weekly-mode.txt proposal/ 2>/dev/null || echo "BLOCKED" > proposal/seo-weekly-mode.txt
          echo "Patch lines: $(wc -l < proposal/site.patch); new files: $(wc -l < proposal/new-files.txt)"

      - name: Upload WAT-only evidence and proposal
        if: always() && steps.duplicate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wat-seo-weekly-${{ github.run_id }}
          path: |
            seo-weekly-context.json
            seo-weekly-opportunities.json
            seo-weekly-skills.json
            proposal/
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Job 2: deterministic publishing FOR REVIEW. No AI runs here.
  # Pushes only to a new seo-weekly/* branch, opens a DRAFT PR, creates the issue.
  # There is no merge command anywhere in this workflow.
  # ---------------------------------------------------------------------------
  publish-for-review:
    needs: analyse
    if: always() && needs.analyse.result != 'skipped' && needs.analyse.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wat-seo-weekly-${{ github.run_id }}
          path: evidence
      - name: Open draft PR (never merged automatically) and weekly issue
        shell: bash
        env:
          READY: ${{ needs.analyse.outputs.ready }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Europe/Brussels date +%F)"
          MODE="$(tr -dc 'A-Z ' < evidence/proposal/seo-weekly-mode.txt | head -c 20)"
          [ "$READY" = "true" ] || MODE="BLOCKED"
          [ -n "$MODE" ] || MODE="BLOCKED"
          PR_URL=""
          BRANCH_URL=""
          if [ "$READY" = "true" ] && { [ -s evidence/proposal/site.patch ] || [ -s evidence/proposal/new-files.txt ]; }; then
            BRANCH="seo-weekly/${TODAY}-${GITHUB_RUN_ID}"
            case "$BRANCH" in seo-weekly/*) ;; *) echo "Refusing unexpected branch"; exit 1;; esac
            git config user.name "github-actions[bot]"
            git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
            git switch -c "$BRANCH"
            [ -s evidence/proposal/site.patch ] && git apply --index evidence/proposal/site.patch
            [ -s evidence/proposal/new-files.tgz ] && tar -xzf evidence/proposal/new-files.tgz && git add -- $(cat evidence/proposal/new-files.txt)
            if git diff --cached --name-only | grep -E '^(\.github|\.claude|scripts|tests)/'; then
              echo "Proposal touches protected paths; refusing."; exit 1
            fi
            git commit -m "SEO weekly proposal ${TODAY} (draft, needs review)"
            # Explicit refspec: can only ever create/update the seo-weekly branch, never main.
            git push origin "HEAD:refs/heads/${BRANCH}"
            BRANCH_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${BRANCH}"
            # GitHub can disallow Actions-created PRs at repository/org level.
            # Preserve the issue + Telegram delivery even if PR creation is blocked.
            if ! PR_URL="$(gh pr create --draft --base main --head "$BRANCH" \
              --title "SEO Weekly ${TODAY} — proposal for review" \
              --body-file evidence/proposal/seo-weekly-report.md)"; then
              echo "::warning title=WAT SEO PR permission::Actions could not open a PR; owner must enable Actions-created pull requests in repository Actions settings. Proposal branch: ${BRANCH_URL}"
              PR_URL=""
            fi
          fi
          TITLE="SEO Weekly — ${TODAY} — ${MODE}"
          FOUND="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "${TITLE} in:title" --json number --jq 'length' --limit 10)"
          if [ "$FOUND" = "0" ]; then
            {
              cat evidence/proposal/seo-weekly-report.md
              echo; echo "---"
              echo "Draft PR (needs owner approval, not merged): ${PR_URL:-not created}"
              if [ -n "$BRANCH_URL" ] && [ -z "$PR_URL" ]; then
                echo "ACTION REQUIRED: Enable Actions-created pull requests under Settings > Actions > General > Workflow permissions. Branch ready for manual PR: ${BRANCH_URL}"
              fi
              echo "Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            } > issue.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file issue.md
          fi

      - name: Send optional WAT-only Telegram status
        continue-on-error: true
        env:
          WAT_TELEGRAM_BOT_TOKEN: ${{ secrets.WAT_TELEGRAM_BOT_TOKEN }}
          WAT_TELEGRAM_CHAT_ID: ${{ secrets.WAT_TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ -z "$WAT_TELEGRAM_BOT_TOKEN" ] || [ -z "$WAT_TELEGRAM_CHAT_ID" ]; then
            echo "WAT Telegram not configured; no cross-project notification sent."
            exit 0
          fi
          TODAY="$(TZ=Europe/Brussels date +%F)"
          ISSUE_URL="$(gh issue list --repo "$GITHUB_REPOSITORY" --search "SEO Weekly — ${TODAY} in:title" --json url --jq '.[0].url // empty' --limit 20)"
          export ISSUE_URL
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          text = "WAT Agency — weekly SEO report\n" + (os.getenv("ISSUE_URL") or "Issue not available; check Actions log")
          data = urllib.parse.urlencode({"chat_id": os.environ["WAT_TELEGRAM_CHAT_ID"], "text": text}).encode()
          urllib.request.urlopen("https://api.telegram.org/bot" + os.environ["WAT_TELEGRAM_BOT_TOKEN"] + "/sendMessage", data=data, timeout=15)
          PY
