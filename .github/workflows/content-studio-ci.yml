name: WAT Content Studio CI
on:
  push:
    branches: [feat/wat-content-studio]
    paths:
      - 'content-studio/**'
      - '.github/workflows/content-studio-ci.yml'
  pull_request:
    paths:
      - 'content-studio/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
