name: WAT — Verify Claude and Google Connections

# Diagnostic only. Read-only token, no deploy, no repository writes.
# Runs on main push and manual dispatch; OIDC trust is restricted to main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wat-verify-connections.yml'
      - 'scripts/wat_verify_connections.py'
      - 'scripts/wat_brand.py'
      - 'scripts/wat_ads_collect.py'
      - 'tests/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: wat-verify-connections
  cancel-in-progress: true

jobs:
  verify-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GSC_SITE_URL: ${{ vars.WAT_GSC_SITE_URL || 'sc-domain:watagencybelgium.be' }}
      WAT_GOOGLE_ADS_CUSTOMER_ID: ${{ vars.WAT_GOOGLE_ADS_CUSTOMER_ID }}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ vars.WAT_GOOGLE_ADS_LOGIN_CUSTOMER_ID || secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
      GOOGLE_ADS_API_VERSION: v26
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Presence flags only (true/false). Secret values are never echoed.
      WAT_SECRET_PRESENCE: >-
        {"ANTHROPIC_API_KEY": ${{ secrets.ANTHROPIC_API_KEY != '' }},
        "GOOGLE_ADS_LOGIN_CUSTOMER_ID_secret": ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID != '' }},
        "WAT_GOOGLE_ADS_LOGIN_CUSTOMER_ID_var": ${{ vars.WAT_GOOGLE_ADS_LOGIN_CUSTOMER_ID != '' }},
        "WAT_GOOGLE_ADS_CUSTOMER_ID_var": ${{ vars.WAT_GOOGLE_ADS_CUSTOMER_ID != '' }},
        "WAT_GSC_SITE_URL_var": ${{ vars.WAT_GSC_SITE_URL != '' }}}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: steadfast-sign-506214-r8
          workload_identity_provider: projects/119496279676/locations/global/workloadIdentityPools/wat-github/providers/wat-actions
          service_account: wat-seo-automation@steadfast-sign-506214-r8.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          # Force actual service-account token minting during this step, so
          # IAM/ST​S errors surface clearly instead of deferred RefreshError.
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/webmasters.readonly
            https://www.googleapis.com/auth/adwords
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report which secrets/variables this job can see (names and true/false only)
        run: |
          python - <<'PY'
          import json, os
          flags = json.loads(os.environ["WAT_SECRET_PRESENCE"])
          print("::notice title=Secret presence::" + ", ".join(f"{k}={'set' if v else 'missing'}" for k, v in flags.items()))
          PY
      - name: Install only verifier dependencies
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Validate diagnostic Python syntax
        run: python -m py_compile scripts/wat_verify_connections.py scripts/wat_brand.py scripts/wat_ads_collect.py
      - name: Brand-filter regression tests
        run: python -m unittest discover -s tests -v
      - name: Check real Claude, WAT Search Console and WAT Google Ads access
        run: python scripts/wat_verify_connections.py
      - name: Upload non-secret verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wat-connections-${{ github.run_id }}
          path: wat-connection-check.json
          if-no-files-found: warn
          retention-days: 14
