<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="rMain" x1="80" y1="60" x2="520" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset="0.35" stop-color="#FFE85C"/>
      <stop offset="0.62" stop-color="#E8A600"/>
      <stop offset="1" stop-color="#FFD400"/>
    </linearGradient>
    <radialGradient id="rNode" cx="0.34" cy="0.3" r="0.72">
      <stop offset="0" stop-color="#FFF08A"/>
      <stop offset="0.55" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#C98F00"/>
    </radialGradient>
  </defs>

  <!-- outer guide orbits -->
  <ellipse cx="300" cy="300" rx="268" ry="252" stroke="#FFD400" stroke-opacity="0.30"
           stroke-width="2" stroke-dasharray="3 11"/>
  <ellipse cx="292" cy="304" rx="250" ry="266" transform="rotate(-14 292 304)"
           stroke="#F4F2EC" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- inner guide orbit -->
  <ellipse cx="304" cy="298" rx="212" ry="206" stroke="#FFD400" stroke-opacity="0.42"
           stroke-width="2" stroke-dasharray="4 12"/>

  <!-- primary ring -->
  <ellipse cx="300" cy="300" rx="240" ry="238" transform="rotate(-8 300 300)"
           stroke="url(#rMain)" stroke-width="5" stroke-linecap="round"/>

  <!-- travelling nodes -->
  <g>
    <circle cx="516" cy="196" r="34" fill="url(#rNode)"/>
    <circle cx="516" cy="196" r="46" stroke="#FFD400" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="516" cy="196" r="58" stroke="#FFD400" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
  <g>
    <circle cx="112" cy="440" r="19" fill="url(#rNode)"/>
    <circle cx="112" cy="440" r="31" stroke="#FFD400" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <circle cx="344" cy="62" r="11" fill="#FFD400"/>
  <circle cx="534" cy="326" r="11" fill="#FFD400"/>
  <circle cx="268" cy="536" r="11" fill="#FFD400"/>
  <circle cx="92" cy="212" r="8" fill="#FFD400"/>

  <circle cx="92" cy="112" r="8" fill="#F4F2EC" fill-opacity="0.55"/>
  <circle cx="418" cy="108" r="6" fill="#F4F2EC" fill-opacity="0.45"/>
  <circle cx="32" cy="292" r="7" fill="#F4F2EC" fill-opacity="0.5"/>
  <circle cx="572" cy="336" r="6" fill="#F4F2EC" fill-opacity="0.4"/>
  <circle cx="512" cy="452" r="8" fill="#F4F2EC" fill-opacity="0.45"/>
</svg>
